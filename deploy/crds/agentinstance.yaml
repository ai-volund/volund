apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentinstances.volund.ai
spec:
  group: volund.ai
  names:
    kind: AgentInstance
    listKind: AgentInstanceList
    plural: agentinstances
    singular: agentinstance
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.state
        - name: Pool
          type: string
          jsonPath: .spec.poolName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [poolName, tenantId, image, llmRouterAddr]
              properties:
                poolName:
                  type: string
                tenantId:
                  type: string
                profileId:
                  type: string
                image:
                  type: string
                llmRouterAddr:
                  type: string
                natsUrl:
                  type: string
            status:
              type: object
              properties:
                state:
                  type: string
                  enum: [pending, warm, active, terminating]
                podName:
                  type: string
                claimedBy:
                  type: string
                lastHeartbeat:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
