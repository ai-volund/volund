apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentwarmpool.volund.ai
spec:
  group: volund.ai
  names:
    kind: AgentWarmPool
    listKind: AgentWarmPoolList
    plural: agentwarmpool
    singular: agentwarmpool
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Desired
          type: integer
          jsonPath: .spec.replicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [replicas, tenantId, image, llmRouterAddr, idleTimeoutSeconds]
              properties:
                replicas:
                  type: integer
                  minimum: 0
                  default: 2
                tenantId:
                  type: string
                profileId:
                  type: string
                image:
                  type: string
                  default: ghcr.io/ai-volund/volund-agent:latest
                llmRouterAddr:
                  type: string
                  default: volund-controlplane:9091
                natsUrl:
                  type: string
                idleTimeoutSeconds:
                  type: integer
                  default: 300
            status:
              type: object
              properties:
                readyReplicas:
                  type: integer
                activeReplicas:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
