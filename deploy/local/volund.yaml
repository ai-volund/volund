apiVersion: apps/v1
kind: Deployment
metadata:
  name: volund
  namespace: default
spec:
  selector:
    matchLabels:
      app: volund
  template:
    metadata:
      labels:
        app: volund
    spec:
      containers:
        - name: volund
          image: ghcr.io/ai-volund/volund
          command: ["/bin/volund", "serve", "--all"]
          env:
            - name: VOLUND_DATABASE_URL
              value: postgres://volund:volund@postgres:5432/volund?sslmode=disable
            - name: VOLUND_NATS_URL
              value: nats://nats:4222
            - name: VOLUND_GATEWAY_HTTP_ADDR
              value: ":8080"
            - name: VOLUND_GATEWAY_GRPC_ADDR
              value: ":9090"
            - name: VOLUND_CONTROLPLANE_ADDR
              value: ":9091"
            - name: VOLUND_JWT_SECRET
              value: dev-secret-change-me
            - name: VOLUND_SKILL_CONFIG
              value: /etc/volund/skills.json
            - name: VOLUND_CREDENTIAL_KEY
              value: "89731e7b8305a1dacfd70c1a0762d23c1c42c1f092dfedc7de9e3d4e842096ed"
            - name: VOLUND_OTLP_ENDPOINT
              value: otel-collector:4317
            - name: VOLUND_OPENAI_BASE_URL
              value: https://api.ai.it.ufl.edu
            - name: VOLUND_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: volund-secrets
                  key: openai-api-key
                  optional: true
          ports:
            - containerPort: 8080
            - containerPort: 9090
            - containerPort: 9091
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: volund
  namespace: default
spec:
  selector:
    app: volund
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
    - name: controlplane
      port: 9091
      targetPort: 9091
