apiVersion: volund.ai/v1alpha1
kind: AgentProfile
metadata:
  name: default-orchestrator
  namespace: default
spec:
  displayName: "Default Orchestrator"
  description: "General-purpose orchestrator agent with skill support"
  profileType: orchestrator
  systemPrompt: "You are a helpful AI assistant powered by the Volund platform. Be concise and direct in your responses."
  model:
    provider: openai
    name: gpt-oss-120b
    temperature: 0.7
    maxTokens: 4096
  skills:
    - volund-guidelines
    - echo-test
  delegation:
    canDelegate: true
    maxConcurrent: 3
  maxToolRounds: 25
