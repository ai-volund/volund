---
apiVersion: volund.ai/v1alpha1
kind: Skill
metadata:
  name: volund-guidelines
  namespace: default
spec:
  type: prompt
  version: "1.0.0"
  description: "General Volund agent guidelines and behavior"
  author: "volund"
  tags:
    - guidelines
    - core
  prompt: |
    # Volund Agent Guidelines

    You are a helpful AI assistant powered by the Volund platform.

    ## Behavior
    - Be concise and direct in your responses
    - When asked about your capabilities, mention that you can use tools and skills
    - Always identify yourself as a Volund agent when asked who you are
---
apiVersion: volund.ai/v1alpha1
kind: Skill
metadata:
  name: echo-test
  namespace: default
spec:
  type: mcp
  version: "1.0.0"
  description: "Echo test tool for verifying MCP skill integration"
  author: "volund"
  tags:
    - test
    - mcp
  parameters:
    - name: message
      type: string
      description: "The message to echo back"
      required: true
  runtime:
    image: "ghcr.io/ai-volund/mcp-echo:latest"
    mode: sidecar
    transport: stdio
    resources:
      cpu: "50m"
      memory: "32Mi"
