apiVersion: v1
kind: Secret
metadata:
  name: {{ include "volund.fullname" . }}-secrets
  labels:
    {{- include "volund.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.gateway.jwtSecret | quote }}
  {{- if .Values.database.url }}
  database-url: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if .Values.gateway.credentialEncryptionKey }}
  credential-encryption-key: {{ .Values.gateway.credentialEncryptionKey | quote }}
  {{- end }}
